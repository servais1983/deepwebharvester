[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepwebharvester"
version = "2.1.0"
description = "Advanced OSINT dark web intelligence gathering tool via Tor"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Tech Enthusiast" }]
keywords = ["osint", "tor", "darkweb", "cybersecurity", "scraper", "intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31.0",
    "PySocks>=1.7.1",
    "stem>=1.8.1",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",
    "matplotlib>=3.8.0",
    "networkx>=3.2.0",
]

[project.optional-dependencies]
async = [
    "aiohttp>=3.9.0",
    "aiohttp-socks>=0.8.4",
]
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
]
observability = [
    "prometheus-client>=0.20.0",
]
cache = [
    "redis>=5.0.0",
]
intel = [
    "stix2>=3.0.1",
]
full = [
    "deepwebharvester[async,api,observability,cache,intel]",
]


[project.scripts]
deepwebharvester     = "deepwebharvester.cli:main"
deepwebharvester-gui = "deepwebharvester.gui:main"
deepwebharvester-api = "deepwebharvester.api_server:main"

[project.urls]
Homepage = "https://github.com/servais1983/deepwebharvester"
Issues   = "https://github.com/servais1983/deepwebharvester/issues"

# ── Tool configuration ────────────────────────────────────────────────────────

[tool.setuptools.packages.find]
where = ["."]
include = ["deepwebharvester*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = [
    "--cov=deepwebharvester",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "-v",
]

[tool.coverage.run]
source   = ["deepwebharvester"]
omit     = [
    "*/tests/*",
    "deepwebharvester/gui.py",
    "deepwebharvester/visualizer.py",
    "deepwebharvester/report.py",
    "deepwebharvester/cli.py",
    "deepwebharvester/api_server.py",
]

[tool.coverage.report]
show_missing    = true
skip_covered    = false
fail_under      = 80
