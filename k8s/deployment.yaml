apiVersion: apps/v1
kind: Deployment
metadata:
  name: dwh-api
  namespace: deepwebharvester
  labels:
    app: dwh-api
    version: "2.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dwh-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: dwh-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: dwh-api
          image: deepwebharvester:2.0.0
          ports:
            - containerPort: 8000
              name: api
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: dwh-config
            - secretRef:
                name: dwh-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: results
              mountPath: /app/results
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: dwh-results-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: dwh-api-service
  namespace: deepwebharvester
spec:
  selector:
    app: dwh-api
  ports:
    - name: api
      port: 80
      targetPort: 8000
    - name: metrics
      port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dwh-api-hpa
  namespace: deepwebharvester
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dwh-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dwh-results-pvc
  namespace: deepwebharvester
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 10Gi
